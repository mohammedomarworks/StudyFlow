<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow — Tasks</title>
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('sp_settings') || '{}');
        var t = s.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body data-page="tasks">

  <!-- ===================== NAVBAR ===================== -->
  <nav class="navbar">
    <div class="navbar__inner">
      <a href="../index.html" class="brand">
        <span class="brand__mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z" /><path d="M6 12v5c0 1 2 3 6 3s6-2 6-3v-5" /></svg>
        </span>
        <span>Study<b>Flow</b></span>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html" data-nav="dashboard">Dashboard</a></li>
        <li><a href="subjects.html" data-nav="subjects">Subjects</a></li>
        <li><a href="tasks.html" data-nav="tasks">Tasks</a></li>
        <li><a href="calendar.html" data-nav="calendar">Calendar</a></li>
        <li><a href="progress.html" data-nav="progress">Progress</a></li>
        <li><a href="notes.html" data-nav="notes">Notes</a></li>
        <li><a href="about.html" data-nav="about">About</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
        </button>
        <button class="nav-toggle" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18" /></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ===================== MAIN ===================== -->
  <main class="page">
    <div class="container">

      <div class="page-header flex-between wrap gap-4">
        <div>
          <h1>Tasks</h1>
          <p>Plan, track and complete your study tasks. Everything is saved automatically.</p>
        </div>
        <button class="btn btn-primary" id="addTaskBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          Add Task
        </button>
      </div>

      <!-- Toolbar: search · filter by subject · filter by status · sort -->
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
          <input class="input" id="searchInput" type="search" placeholder="Search tasks by title or notes…" />
        </div>
        <select class="select" id="filterSubject" aria-label="Filter by subject">
          <option value="">All subjects</option>
        </select>
        <select class="select" id="filterStatus" aria-label="Filter by status">
          <option value="all">All status</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
        </select>
        <select class="select" id="sortBy" aria-label="Sort tasks">
          <option value="due-asc">Sort: Due date ↑</option>
          <option value="due-desc">Sort: Due date ↓</option>
          <option value="priority">Sort: Priority</option>
          <option value="created">Sort: Recently added</option>
        </select>
      </div>

      <!-- Result count -->
      <p class="text-muted mt-2" id="resultCount" style="margin-bottom:var(--space-4)"></p>

      <!-- Task list (rendered by tasks.js) -->
      <div class="task-list" id="taskList"></div>
    </div>
  </main>

  <!-- ===================== ADD / EDIT MODAL ===================== -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal__head">
        <h3 id="taskModalTitle">Add Task</h3>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>

      <!-- novalidate: we run our own validation for consistent styling -->
      <form id="taskForm" novalidate>
        <div class="modal__body">
          <input type="hidden" id="taskId" />

          <div class="field" id="f-title">
            <label>Title <span class="req">*</span></label>
            <input class="input" id="taskTitle" maxlength="120" placeholder="e.g. Finish chapter 4 exercises" />
            <div class="field-error">Please enter a task title (at least 2 characters).</div>
          </div>

          <div class="form-row">
            <div class="field">
              <label>Subject</label>
              <select class="select" id="taskSubject">
                <option value="">— No subject —</option>
              </select>
            </div>
            <div class="field">
              <label>Priority</label>
              <select class="select" id="taskPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="field" id="f-due">
            <label>Due date <span class="req">*</span></label>
            <input type="date" class="input" id="taskDue" />
            <div class="field-error">Please choose a due date.</div>
          </div>

          <div class="field">
            <label>Notes</label>
            <textarea class="textarea" id="taskNotes" maxlength="500" placeholder="Optional details…"></textarea>
          </div>
        </div>
        <div class="modal__foot">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">Made with <b>StudyFlow</b> · © <span data-year></span></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/tasks.js"></script>
</body>
</html>
