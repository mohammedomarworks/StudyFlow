<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlow — Calendar</title>
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('sp_settings') || '{}');
        var t = s.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body data-page="calendar">

  <nav class="navbar">
    <div class="navbar__inner">
      <a href="../index.html" class="brand">
        <span class="brand__mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z" /><path d="M6 12v5c0 1 2 3 6 3s6-2 6-3v-5" /></svg>
        </span>
        <span>Study<b>Flow</b></span>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html" data-nav="dashboard">Dashboard</a></li>
        <li><a href="subjects.html" data-nav="subjects">Subjects</a></li>
        <li><a href="tasks.html" data-nav="tasks">Tasks</a></li>
        <li><a href="calendar.html" data-nav="calendar">Calendar</a></li>
        <li><a href="progress.html" data-nav="progress">Progress</a></li>
        <li><a href="notes.html" data-nav="notes">Notes</a></li>
        <li><a href="about.html" data-nav="about">About</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
        </button>
        <button class="nav-toggle" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18" /></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="container">
      <div class="page-header">
        <h1>Calendar</h1>
        <p>See your tasks and exams laid out across the month. Click any day for details.</p>
      </div>

      <div class="card">
        <!-- Month navigation -->
        <div class="cal-head">
          <h2 id="calMonthLabel">—</h2>
          <div class="flex gap-2">
            <button class="btn btn-ghost btn-sm" id="calToday">Today</button>
            <button class="icon-btn" id="calPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="icon-btn" id="calNext" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>

        <!-- Weekday headers -->
        <div class="cal-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>

        <!-- Day grid (rendered by calendar.js) -->
        <div class="cal-grid" id="calGrid"></div>

        <!-- Legend -->
        <div class="cal-legend">
          <span><span class="dot" style="background:var(--primary)"></span> Task due</span>
          <span><span class="dot" style="background:var(--danger)"></span> Exam</span>
          <span><span class="dot" style="background:var(--primary);outline:2px solid var(--primary);outline-offset:1px"></span> Today</span>
        </div>
      </div>
    </div>
  </main>

  <!-- DAY DETAIL MODAL -->
  <div class="modal-overlay" id="dayModal">
    <div class="modal">
      <div class="modal__head">
        <h3 id="dayModalTitle">—</h3>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="modal__body" id="dayModalBody"></div>
    </div>
  </div>

  <footer class="footer">Made with <b>StudyFlow</b> · © <span data-year></span></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
