    <div class="navbar__inner">

        <li><a href="about.html" data-nav="about">About</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>

  <main class="page">
    <div class="container">
      <div class="page-header">
        <h1>Progress</h1>
        <p>Track how you're doing across all subjects. Keep that ring climbing!</p>
      </div>

      <!-- Overall progress: ring + stat tiles -->
      <div class="card" style="margin-bottom:var(--space-5)">
        <div class="flex wrap gap-4" style="align-items:center; justify-content:space-around">
          <div class="ring-wrap" id="overallRing"></div>
          <div class="stats-grid" id="overallTiles" style="flex:1; min-width:280px"></div>
        </div>
      </div>

      <div class="grid two-col">
        <!-- Per-subject progress -->
        <div class="card">
          <div class="card__head"><h2 class="card__title">Progress by Subject</h2></div>
          <div id="subjectProgress"></div>
        </div>

        <!-- Priority breakdown -->
        <div class="card">
          <div class="card__head"><h2 class="card__title">Tasks by Priority</h2></div>
          <div id="priorityBreakdown"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">Made with <b>StudyFlow</b> · © <span data-year></span></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/progress.js"></script>
